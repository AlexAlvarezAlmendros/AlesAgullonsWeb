<!-- @dsCard group="Colors" viewport="700x150" name="Ink" subtitle="Warm near-black browns for type & rules" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--paper-200); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-sm); border: 1px solid var(--line-soft); }
  .name { font-family: var(--font-spec); font-size: 11px; color: var(--ink-700); margin-top: 6px; }
  .hex { font-family: var(--font-spec); font-size: 11px; color: var(--ink-500); }
</style>
</head>
<body class="paper-grain">
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="name">ink-900</div><div class="hex">#20160C</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-800)"></div><div class="name">ink-800</div><div class="hex">#2E2113</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="name">ink-700</div><div class="hex">#463320</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-600)"></div><div class="name">ink-600</div><div class="hex">#6B5436</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="name">ink-500</div><div class="hex">#8A744F</div></div>
  </div>
</body>
</html>
