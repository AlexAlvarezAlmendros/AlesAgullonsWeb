<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="4px base — space-1 … space-9" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--paper-200); }
  .row { display:flex; align-items:flex-end; gap: 14px; }
  .item { text-align:center; }
  .bar { background: var(--brown-700); width: 100%; border-radius: var(--radius-xs); }
  .tag { font-family: var(--font-spec); font-size: 10px; color: var(--ink-600); margin-top:6px; }
</style>
</head>
<body class="paper-grain">
  <div class="row">
    <div class="item"><div class="bar" style="height:4px;width:4px;"></div><div class="tag">1·4</div></div>
    <div class="item"><div class="bar" style="height:8px;width:8px;"></div><div class="tag">2·8</div></div>
    <div class="item"><div class="bar" style="height:12px;width:12px;"></div><div class="tag">3·12</div></div>
    <div class="item"><div class="bar" style="height:16px;width:16px;"></div><div class="tag">4·16</div></div>
    <div class="item"><div class="bar" style="height:24px;width:24px;"></div><div class="tag">5·24</div></div>
    <div class="item"><div class="bar" style="height:32px;width:32px;"></div><div class="tag">6·32</div></div>
    <div class="item"><div class="bar" style="height:48px;width:48px;"></div><div class="tag">7·48</div></div>
    <div class="item"><div class="bar" style="height:64px;width:64px;"></div><div class="tag">8·64</div></div>
  </div>
</body>
</html>
