<!-- @dsCard group="Colors" viewport="700x150" name="Terroir Accents" subtitle="Vine green, merlot & terracotta — barrel & special editions" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--paper-200); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-sm); border: 1px solid var(--line-soft); }
  .name { font-family: var(--font-spec); font-size: 11px; color: var(--ink-700); margin-top: 6px; }
  .hex { font-family: var(--font-spec); font-size: 11px; color: var(--ink-500); }
</style>
</head>
<body class="paper-grain">
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--vine-600)"></div><div class="name">vine-600</div><div class="hex">#5C6B34</div></div>
    <div class="sw"><div class="chip" style="background:var(--vine-500)"></div><div class="name">vine-500</div><div class="hex">#79873F</div></div>
    <div class="sw"><div class="chip" style="background:var(--merlot-700)"></div><div class="name">merlot-700</div><div class="hex">#6E2A30</div></div>
    <div class="sw"><div class="chip" style="background:var(--merlot-600)"></div><div class="name">merlot-600</div><div class="hex">#8A3A3C</div></div>
    <div class="sw"><div class="chip" style="background:var(--terracotta-500)"></div><div class="name">terracotta</div><div class="hex">#B5562F</div></div>
  </div>
</body>
</html>
