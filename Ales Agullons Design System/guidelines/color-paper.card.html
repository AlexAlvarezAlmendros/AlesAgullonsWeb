<!-- @dsCard group="Colors" viewport="700x150" name="Paper & Kraft" subtitle="Parchment surfaces — page grounds & label stock" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px; background: var(--paper-200); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-sm); border: 1px solid var(--line-soft); }
  .name { font-family: var(--font-spec); font-size: 11px; color: var(--ink-700); margin-top: 6px; }
  .hex { font-family: var(--font-spec); font-size: 11px; color: var(--ink-500); }
</style>
</head>
<body class="paper-grain">
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--paper-100)"></div><div class="name">paper-100</div><div class="hex">#FBF6EA</div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-200)"></div><div class="name">paper-200</div><div class="hex">#F4E9D2</div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-300)"></div><div class="name">paper-300</div><div class="hex">#EADCBE</div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-400)"></div><div class="name">paper-400</div><div class="hex">#DFCBA4</div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-500)"></div><div class="name">paper-500</div><div class="hex">#CBB286</div></div>
  </div>
</body>
</html>
