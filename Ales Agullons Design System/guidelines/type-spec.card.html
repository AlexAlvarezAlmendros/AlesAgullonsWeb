<!-- @dsCard group="Type" viewport="700x170" name="Spec mono & Eyebrow" subtitle="Courier Prime for stats; tracked caps for overlines" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--paper-200); }
  .eyebrow { margin-bottom: 12px; }
  .specrow { display:flex; gap: 22px; font-family: var(--font-spec); font-size: 15px; color: var(--ink-800); }
  .specrow b { color: var(--ink-900); }
  .lbl { font-family: var(--font-spec); font-size: 11px; color: var(--ink-500); }
  .meta { font-family: var(--font-spec); font-size: 11px; color: var(--ink-500); margin-top: 16px; }
</style>
</head>
<body class="paper-grain">
  <span class="eyebrow">Cervesa Artesana · Des de 2008</span>
  <div class="specrow">
    <span>ABV <b>5.2%</b></span>
    <span>IBU <b>38</b></span>
    <span>FORMAT <b>75 cl</b></span>
    <span>OG <b>1.048</b></span>
  </div>
  <div class="lbl" style="margin-top:6px;">.spec — typewriter numerals for tasting data</div>
  <div class="meta">Courier Prime mono · .eyebrow caps tracked 0.18em</div>
</body>
</html>
