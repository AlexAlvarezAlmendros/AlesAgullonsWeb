<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 32px; background: var(--paper-200); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .mark { text-align:center; }
  .ale { font-family: var(--font-label); font-size: 14px; letter-spacing: 0.42em; text-transform:uppercase; color: var(--ink-700); margin-left: 0.42em; }
  .name { font-family: var(--font-display); font-size: 56px; line-height: 0.9; color: var(--ink-900); margin: 4px 0; }
  .tag { display:flex; align-items:center; gap:12px; justify-content:center; }
  .tag span { font-family: var(--font-text); font-style: italic; font-size: 14px; color: var(--brown-700); }
  .tag i { display:block; width:44px; height:1.5px; background: var(--ink-700); }
  .flag { font-family: var(--font-spec); font-size: 10px; color: var(--ink-500); margin-top: 18px; }
</style>
</head>
<body class="paper-grain">
  <div class="mark">
    <div class="ale">Ales</div>
    <div class="name">AGULLONS</div>
    <div class="tag"><i></i><span>Cervesa artesana · des de 2008</span><i></i></div>
  </div>
  <div class="flag">⚑ placeholder lockup — supply official logotype</div>
</body>
</html>
