<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../ds-runtime.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--paper-200); }
  .grp { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .lbl { font-family: var(--font-spec); font-size: 10px; color: var(--ink-500); width: 100%; margin-bottom: 2px; }
</style>
</head>
<body class="paper-grain">
  <div id="root"></div>
  <script type="text/babel">
    const { Button, Tag, Eyebrow, Input } = window.AlesAgullonsDesignSystem_76dff6;
    function Demo() {
      return (
        <div>
          <Eyebrow rules>Cervesa Artesana</Eyebrow>
          <div style={{height:14}} />
          <div className="grp">
            <span className="lbl">Button — variants</span>
            <Button variant="primary">Comprar</Button>
            <Button variant="deep">Veure</Button>
            <Button variant="merlot">Especial</Button>
            <Button variant="outline">Totes</Button>
            <Button variant="ghost">Més</Button>
          </div>
          <div className="grp">
            <span className="lbl">Button — sizes &amp; disabled</span>
            <Button size="sm">Sm</Button>
            <Button size="md">Md</Button>
            <Button size="lg">Lg</Button>
            <Button disabled>Esgotat</Button>
          </div>
          <div className="grp">
            <span className="lbl">Tag — tones</span>
            <Tag>Pale Ale</Tag>
            <Tag tone="brown">Brown Ale</Tag>
            <Tag tone="vine">Trigo</Tag>
            <Tag tone="merlot" outline>Barrica</Tag>
            <Tag tone="plain">Cascade</Tag>
          </div>
          <div className="grp" style={{maxWidth:320}}>
            <span className="lbl">Input</span>
            <Input label="Correu" type="email" placeholder="tu@correu.cat" hint="Pel butlletí de la masia." />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
